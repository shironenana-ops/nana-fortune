AWSTemplateFormatVersion: "2010-09-09"
Description: Nana production Release B bootstrap resources

Parameters:
  ExpectedAccountId:
    Type: String
    AllowedValues:
      - "388811589005"
Resources:
  ProductionRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: shirone7/production/runtime
      Description: Canonical production runtime secrets for nana-fortune Release B
      SecretString: "{}"
      Tags:
        - Key: Project
          Value: nana-fortune
        - Key: Environment
          Value: production
        - Key: Component
          Value: canonical-runtime
        - Key: ManagedBy
          Value: cloudformation
  ReleaseBExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: NanaProductionCanonicalRuntimeExecutionRole
      Description: Executes only the nana production canonical runtime stack
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationOnly
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NanaProductionCanonicalRuntimeExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadReleaseBArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: arn:aws:s3:::nana-prod-artifacts-388811589005-apne1/nana-reading-production/release-b/*
              - Sid: ManageOnlyReleaseBRuntimeRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nana-reading-production-*
              - Sid: PassOnlyReleaseBRuntimeRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nana-reading-production-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageOnlyReleaseBFunctions
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:nana-reading-production-*
              - Sid: ManageReleaseBEventSourceMappingsInTokyo
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: ap-northeast-1
              - Sid: ManageOnlyReleaseBTables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/nana-reading-production-*
              - Sid: ManageOnlyReleaseBQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:nana-reading-production-*
              - Sid: ManageOnlyReleaseBLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/nana-reading-production-*
              - Sid: DescribeLogGroupsForReleaseBResolution
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: ap-northeast-1
              - Sid: ManageOnlyReleaseBHttpApi
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*
              - Sid: TagOnlyReleaseBHttpApiOnCreate
                Effect: Allow
                Action: apigateway:POST
                Resource: arn:aws:apigateway:ap-northeast-1::/tags/arn%3Aaws%3Aapigateway%3Aap-northeast-1%3A%3A%2Fv2%2Fapis%2F*
              - Sid: TagOnlyExactReleaseBProductionStage
                Effect: Allow
                Action: apigateway:TagResource
                Resource:
                  - arn:aws:apigateway:ap-northeast-1::/apis/0co01ka06a/stages
                  - arn:aws:apigateway:ap-northeast-1::/apis/0co01ka06a/stages/production
              - Sid: ManageOnlyReleaseBAlarms
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:nana-reading-production-*
              - Sid: ManageOnlyCanonicalRuntimeSecret
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:shirone7/production/runtime-*
      Tags:
        - Key: Project
          Value: nana-fortune
        - Key: Environment
          Value: production
        - Key: Component
          Value: release-b-cloudformation-execution
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  RuntimeSecretArn:
    Description: Exact ARN for the canonical production Runtime Secret
    Value: !Ref ProductionRuntimeSecret
  ExecutionRoleArn:
    Description: Exact role ARN to bind in the Identity Center permission set
    Value: !GetAtt ReleaseBExecutionRole.Arn
  ArtifactBucketName:
    Value: nana-prod-artifacts-388811589005-apne1
  ArtifactPrefix:
    Value: nana-reading-production/release-b/
